# The coverage of the clean-room tests (cleanroom/, see its README) in ScummVM: builds the same ScummVM as
# scummvm-cleanroom.yml with gcov, runs the same tests on it (both games and the Remastered mode, every renderer, all at
# once) and writes the coverage of engines/grim and graphics/tinygl (autorun/tools/covreport.py --all) to the run's
# summary, with the pages of every file as the artifact "coverage". A report: it does not fail. It runs on pushes to main only
# (and by hand), not on other branches, pull requests or a schedule.
name: ScummVM clean-room coverage

on:
  workflow_dispatch:
    inputs:
      scummvm_repo:
        description: ScummVM repository to test
        default: klusark/scummvm
      scummvm_ref:
        description: Branch, tag or commit of it
        default: cleanroom
      apply_patch:
        description: Apply cleanroom/scummvm/grim-test-data.patch (for a branch without it, as upstream master)
        type: boolean
        default: false
      renderers:
        description: Renderers, for Grim and EMI (comma separated)
        default: opengl,opengl_shaders,software
  push:
    branches: [main]
    paths:
      - "cleanroom/**"
      - ".github/workflows/scummvm-coverage.yml"

concurrency:
  group: scummvm-coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  SCUMMVM_REPO: ${{ inputs.scummvm_repo || 'klusark/scummvm' }}
  SCUMMVM_REF: ${{ inputs.scummvm_ref || 'cleanroom' }}
  APPLY_PATCH: ${{ inputs.apply_patch && '1' || '' }}
  CR_RENDERERS: ${{ inputs.renderers || 'opengl,opengl_shaders,software' }}

jobs:
  coverage:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - name: LF line ends
        run: git config --global core.autocrlf false

      - name: Check out grim_tools
        uses: actions/checkout@v4
        with:
          path: grim_tools

      - name: Check out ScummVM
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SCUMMVM_REPO }}
          ref: ${{ env.SCUMMVM_REF }}
          path: scummvm

      - name: MSYS2 packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          install: make git
          pacboy: >-
            toolchain:p ccache:p SDL2:p zlib:p libpng:p libjpeg-turbo:p freetype:p
            libvorbis:p flac:p libmad:p faad2:p a52dec:p libmpeg2:p libtheora:p fribidi:p mesa:p

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ccache-cov-ucrt64-${{ github.run_id }}
          restore-keys: ccache-cov-ucrt64-

      # (gcov, -O0; -DCR_GCOV: the test patch writes the counters in Exit() and every 200 tests, see cleanroom/README.md)
      - name: Build ScummVM with gcov
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}\ccache
          CCACHE_MAXSIZE: 1G
        run: |
          cd scummvm
          echo "ScummVM $SCUMMVM_REPO $SCUMMVM_REF: $(git rev-parse HEAD) $(git log -1 --format=%s)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$APPLY_PATCH" ]; then git apply ../grim_tools/cleanroom/scummvm/grim-test-data.patch; fi
          mkdir build && cd build
          CXX="ccache g++" CC="ccache gcc" CXXFLAGS="--coverage -fprofile-update=atomic -O0" LDFLAGS="--coverage -fprofile-update=atomic" ../configure \
            --disable-all-engines --enable-engines=grim,monkey4 \
            --disable-libcurl --disable-sdlnet --disable-cloud --disable-updates --disable-tts
          sed -i 's/^CXXFLAGS := \(.*\)$/CXXFLAGS := \1 -DCR_GCOV/' config.mk
          make -j$(nproc)
          find . -name '*.gcda' -delete
          ccache -s

      # (Mesa's software OpenGL, llvmpipe: the runner has no GPU. Its opengl32.dll goes next to scummvm.exe, which Windows
      # searches before System32; the rest, libgallium_wgl.dll and LLVM, load from ucrt64\bin, which run.py puts on PATH)
      - name: Mesa llvmpipe
        shell: pwsh
        run: Copy-Item C:\msys64\ucrt64\bin\opengl32.dll scummvm\build\

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # (the results do not matter here, only what ran: a failing game does not stop the other or the report)
      # (every game and renderer at once, tools/parallel.sh: the processes add their counters to the same .gcda files when
      # they end, under libgcov's lock, and -fprofile-update=atomic keeps ScummVM's threads' counts. ScummVM's Remastered
      # mode is there for its own code: a report only)
      - name: Tests
        continue-on-error: true
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: "1"
          CR_VISIBLE: "1"
          CR_STALL: "120"
          CR_STARTUP: "300"
        run: |
          export SCUMMVM="$GITHUB_WORKSPACE\\scummvm\\build\\scummvm.exe"
          rc=0
          CR_PARALLEL_DIR="$(cygpath -u "$RUNNER_TEMP")/parallel_cov" bash grim_tools/cleanroom/tools/parallel.sh --games grim,emi,remastered --renderers "$CR_RENDERERS" || true
          for g in grim emi remastered; do cat "$(cygpath -u "$RUNNER_TEMP")"/parallel_cov/${g}_*.txt > $g.txt; done
          exit 0

      - name: Report
        if: always()
        shell: pwsh
        run: |
          $sha = git -C scummvm rev-parse --short HEAD
          python grim_tools\autorun\tools\covreport.py coverage "$env:GITHUB_WORKSPACE\scummvm\build" "$env:GITHUB_WORKSPACE\scummvm" --all `
            --title "the clean-room tests (Grim and EMI, renderers $env:CR_RENDERERS) on $env:SCUMMVM_REPO $env:SCUMMVM_REF ($sha)"
          Add-Content $env:GITHUB_STEP_SUMMARY "### Coverage`n``````"
          Get-Content coverage\summary.txt | Select-Object -First 60 | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY "``````"
          Add-Content $env:GITHUB_STEP_SUMMARY "Each file with the lines never run: the artifact ``coverage`` (index.html)."

      - name: Coverage pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/
            grim.txt
            emi.txt
            remastered.txt
          if-no-files-found: ignore
