# The clean-room engine tests (cleanroom/, see its README) against ScummVM: builds the branch cleanroom of klusark/scummvm
# (the test patch and the fixes in progress, as in ~/scummvm-cleanroom) and runs `run.py scummvm` for Grim and for EMI,
# compared with the expected logs of the originals (cleanroom/expected/). Another repository or branch can be given by hand;
# one without the test patch (upstream master) gets cleanroom/scummvm/grim-test-data.patch with "apply_patch". The
# originals themselves are not run here (no game files on the runner).
# The job fails when a test differs without a cr_scummvm_differs mark, or crashes ScummVM without one.
# The job "coverage" runs the same tests (both games, every renderer) on a gcov build of the same ScummVM and writes the
# coverage of engines/grim and graphics/tinygl (autorun/tools/covreport.py --all) to the run's summary, with the pages of
# every file as the artifact "coverage". It does not fail the run.
name: ScummVM clean-room tests

on:
  workflow_dispatch:
    inputs:
      scummvm_repo:
        description: ScummVM repository to test
        default: klusark/scummvm
      scummvm_ref:
        description: Branch, tag or commit of it
        default: cleanroom
      apply_patch:
        description: Apply cleanroom/scummvm/grim-test-data.patch (for a branch without it, as upstream master)
        type: boolean
        default: false
      renderers:
        description: Renderers, for Grim and EMI (comma separated)
        default: opengl,opengl_shaders,software
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: [main]
    paths:
      - "cleanroom/**"
      - ".github/workflows/scummvm-cleanroom.yml"

concurrency:
  group: scummvm-cleanroom-${{ github.ref }}
  cancel-in-progress: true

env:
  SCUMMVM_REPO: ${{ inputs.scummvm_repo || 'klusark/scummvm' }}
  SCUMMVM_REF: ${{ inputs.scummvm_ref || 'cleanroom' }}
  APPLY_PATCH: ${{ inputs.apply_patch && '1' || '' }}
  CR_RENDERERS: ${{ inputs.renderers || 'opengl,opengl_shaders,software' }}
  # (Mesa's software OpenGL, llvmpipe, next to scummvm.exe: the runner has no GPU)
  MESA_VERSION: "26.2.4"

jobs:
  scummvm:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      # (the runner's git writes CRLF on Windows: the patch, with LF, would not apply to ScummVM's files)
      - name: LF line ends
        run: git config --global core.autocrlf false

      - name: Check out grim_tools
        uses: actions/checkout@v4
        with:
          path: grim_tools

      - name: Check out ScummVM
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SCUMMVM_REPO }}
          ref: ${{ env.SCUMMVM_REF }}
          path: scummvm

      # (the runner's own MSYS2 at C:\msys64, the path run.py and its tools use)
      - name: MSYS2 packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          install: make git
          pacboy: >-
            toolchain:p ccache:p SDL2:p zlib:p libpng:p libjpeg-turbo:p freetype:p
            libvorbis:p flac:p libmad:p faad2:p a52dec:p libmpeg2:p libtheora:p fribidi:p

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ccache-ucrt64-${{ github.run_id }}
          restore-keys: ccache-ucrt64-

      - name: Build ScummVM
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}\ccache
          CCACHE_MAXSIZE: 1G
        run: |
          cd scummvm
          echo "ScummVM $SCUMMVM_REPO $SCUMMVM_REF: $(git rev-parse HEAD) $(git log -1 --format=%s)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$APPLY_PATCH" ]; then git apply ../grim_tools/cleanroom/scummvm/grim-test-data.patch; fi
          mkdir build && cd build
          CXX="ccache g++" CC="ccache gcc" ../configure --disable-all-engines --enable-engines=grim,monkey4 --enable-release \
            --disable-libcurl --disable-sdlnet --disable-cloud --disable-updates --disable-tts
          make -j$(nproc)
          ccache -s

      - name: Mesa llvmpipe
        shell: pwsh
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-mingw.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          7z x -y -omesa mesa.7z | Out-Null
          foreach ($f in "opengl32.dll", "libgallium_wgl.dll", "dxil.dll") { Copy-Item "mesa\x64\$f" scummvm\build\ }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Grim
        id: grim
        continue-on-error: true
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          # (the windows on the runner's desktop; the runner is slower than a desk machine)
          CR_VISIBLE: "1"
          CR_STALL: "30"
          CR_STARTUP: "120"
        run: |
          $env:SCUMMVM = "$env:GITHUB_WORKSPACE\scummvm\build\scummvm.exe"
          python grim_tools\cleanroom\run.py scummvm 2>&1 | Tee-Object grim.txt
          exit $LASTEXITCODE

      - name: EMI
        id: emi
        continue-on-error: true
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          CR_VISIBLE: "1"
          CR_STALL: "30"
          CR_STARTUP: "120"
        run: |
          $env:SCUMMVM = "$env:GITHUB_WORKSPACE\scummvm\build\scummvm.exe"
          python grim_tools\cleanroom\run.py scummvm --game emi 2>&1 | Tee-Object emi.txt
          exit $LASTEXITCODE

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          foreach ($g in "grim", "emi") {
            if (-not (Test-Path "$g.txt")) { continue }
            Add-Content $env:GITHUB_STEP_SUMMARY "### $g`n``````"
            Get-Content "$g.txt" | Where-Object { $_ -match '^==== |REGRESSION|tests differ|crashed or hung|not marked|fixed, take the mark out' } |
              ForEach-Object { if ($_.Length -gt 400) { $_.Substring(0, 400) + " ..." } else { $_ } } |
              Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY "``````"
          }

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanroom-logs
          path: |
            grim.txt
            emi.txt
            grim_tools/cleanroom/logs/
          if-no-files-found: ignore

      - name: Result
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.grim.outcome }}" -ne "success" -or "${{ steps.emi.outcome }}" -ne "success") {
            Write-Error "Grim: ${{ steps.grim.outcome }}, EMI: ${{ steps.emi.outcome }} (regressions or new crashers: see the summary and the logs)"
            exit 1
          }

  coverage:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - name: LF line ends
        run: git config --global core.autocrlf false

      - name: Check out grim_tools
        uses: actions/checkout@v4
        with:
          path: grim_tools

      - name: Check out ScummVM
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SCUMMVM_REPO }}
          ref: ${{ env.SCUMMVM_REF }}
          path: scummvm

      - name: MSYS2 packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          install: make git
          pacboy: >-
            toolchain:p ccache:p SDL2:p zlib:p libpng:p libjpeg-turbo:p freetype:p
            libvorbis:p flac:p libmad:p faad2:p a52dec:p libmpeg2:p libtheora:p fribidi:p

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ccache-cov-ucrt64-${{ github.run_id }}
          restore-keys: ccache-cov-ucrt64-

      # (gcov, -O0; -DCR_GCOV: the test patch writes the counters in Exit() and every 200 tests, see cleanroom/README.md)
      - name: Build ScummVM with gcov
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}\ccache
          CCACHE_MAXSIZE: 1G
        run: |
          cd scummvm
          echo "ScummVM $SCUMMVM_REPO $SCUMMVM_REF: $(git rev-parse HEAD) $(git log -1 --format=%s)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$APPLY_PATCH" ]; then git apply ../grim_tools/cleanroom/scummvm/grim-test-data.patch; fi
          mkdir build && cd build
          CXX="ccache g++" CC="ccache gcc" CXXFLAGS="--coverage -O0" LDFLAGS="--coverage" ../configure \
            --disable-all-engines --enable-engines=grim,monkey4 \
            --disable-libcurl --disable-sdlnet --disable-cloud --disable-updates --disable-tts
          sed -i 's/^CXXFLAGS := \(.*\)$/CXXFLAGS := \1 -DCR_GCOV/' config.mk
          make -j$(nproc)
          find . -name '*.gcda' -delete
          ccache -s

      - name: Mesa llvmpipe
        shell: pwsh
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-mingw.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          7z x -y -omesa mesa.7z | Out-Null
          foreach ($f in "opengl32.dll", "libgallium_wgl.dll", "dxil.dll") { Copy-Item "mesa\x64\$f" scummvm\build\ }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # (the results do not matter here, only what ran: a failing game does not stop the other or the report)
      - name: Tests
        continue-on-error: true
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          CR_VISIBLE: "1"
          CR_STALL: "90"
          CR_STARTUP: "240"
        run: |
          $env:SCUMMVM = "$env:GITHUB_WORKSPACE\scummvm\build\scummvm.exe"
          python grim_tools\cleanroom\run.py scummvm 2>&1 | Tee-Object grim.txt | Select-String '^==== '
          python grim_tools\cleanroom\run.py scummvm --game emi 2>&1 | Tee-Object emi.txt | Select-String '^==== '
          # (ScummVM's Remastered mode, for its own code: a report only, it never fails)
          python grim_tools\cleanroom\run.py scummvm --remastered 2>&1 | Tee-Object remastered.txt | Select-String '^==== '
          exit 0

      - name: Report
        if: always()
        shell: pwsh
        run: |
          $sha = git -C scummvm rev-parse --short HEAD
          python grim_tools\autorun\tools\covreport.py coverage "$env:GITHUB_WORKSPACE\scummvm\build" "$env:GITHUB_WORKSPACE\scummvm" --all `
            --title "the clean-room tests (Grim and EMI, renderers $env:CR_RENDERERS) on $env:SCUMMVM_REPO $env:SCUMMVM_REF ($sha)"
          Add-Content $env:GITHUB_STEP_SUMMARY "### Coverage`n``````"
          Get-Content coverage\summary.txt | Select-Object -First 60 | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY "``````"
          Add-Content $env:GITHUB_STEP_SUMMARY "Each file with the lines never run: the artifact ``coverage`` (index.html)."

      - name: Coverage pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/
            grim.txt
            emi.txt
            remastered.txt
          if-no-files-found: ignore
