# The clean-room engine tests (cleanroom/, see its README) against ScummVM: builds upstream master of scummvm/scummvm with
# cleanroom/scummvm/grim-test-data.patch applied (nothing else: the reference the expected crasher lists are made with) and
# runs `run.py scummvm` for Grim and for EMI (cleanroom/tools/parallel.sh: the renderers of a game at once), compared with
# the expected logs of the originals (cleanroom/expected/). Another repository or branch can be given by hand; one that
# already has the test patch (as klusark/scummvm cleanroom) is run with "apply_patch" off. The originals themselves are
# not run here (no game files on the runner).
# The job fails when a test differs without a cr_scummvm_differs mark, or crashes ScummVM without one.
# It runs nightly (upstream master moves), on pushes to main, by hand, and on every pull request through pr.yml
# (workflow_call). The coverage of the same tests: scummvm-coverage.yml.
name: ScummVM clean-room tests

on:
  workflow_dispatch:
    inputs:
      scummvm_repo:
        description: ScummVM repository to test
        default: scummvm/scummvm
      scummvm_ref:
        description: Branch, tag or commit of it
        default: master
      apply_patch:
        description: Apply cleanroom/scummvm/grim-test-data.patch (off for a branch that has it already)
        type: boolean
        default: true
      renderers:
        description: Renderers, for Grim and EMI (comma separated)
        default: opengl,opengl_shaders,software
  workflow_call:
  schedule:
    - cron: "23 5 * * *"
  # (a PR branch's pushes run through pr.yml, as the PR)
  push:
    branches: [main]
    paths:
      - "cleanroom/**"
      - ".github/workflows/scummvm-cleanroom.yml"

concurrency:
  group: scummvm-cleanroom-${{ github.ref }}
  cancel-in-progress: true

env:
  SCUMMVM_REPO: ${{ inputs.scummvm_repo || 'scummvm/scummvm' }}
  SCUMMVM_REF: ${{ inputs.scummvm_ref || 'master' }}
  # (the schedule and pushes have no inputs: they apply the patch too)
  APPLY_PATCH: ${{ (github.event_name != 'workflow_dispatch' || inputs.apply_patch) && '1' || '' }}
  CR_RENDERERS: ${{ inputs.renderers || 'opengl,opengl_shaders,software' }}

jobs:
  scummvm:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      # (the runner's git writes CRLF on Windows: the patch, with LF, would not apply to ScummVM's files)
      - name: LF line ends
        run: git config --global core.autocrlf false

      - name: Check out grim_tools
        uses: actions/checkout@v4
        with:
          path: grim_tools

      - name: Check out ScummVM
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SCUMMVM_REPO }}
          ref: ${{ env.SCUMMVM_REF }}
          path: scummvm

      # (the runner's own MSYS2 at C:\msys64, the path run.py and its tools use)
      - name: MSYS2 packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          install: make git
          pacboy: >-
            toolchain:p ccache:p SDL2:p zlib:p libpng:p libjpeg-turbo:p freetype:p
            libvorbis:p flac:p libmad:p faad2:p a52dec:p libmpeg2:p libtheora:p fribidi:p mesa:p

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ccache-ucrt64-${{ github.run_id }}
          restore-keys: ccache-ucrt64-

      - name: Build ScummVM
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}\ccache
          CCACHE_MAXSIZE: 1G
        run: |
          cd scummvm
          echo "ScummVM $SCUMMVM_REPO $SCUMMVM_REF: $(git rev-parse HEAD) $(git log -1 --format=%s)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$APPLY_PATCH" ]; then git apply ../grim_tools/cleanroom/scummvm/grim-test-data.patch; fi
          mkdir build && cd build
          CXX="ccache g++" CC="ccache gcc" ../configure --disable-all-engines --enable-engines=grim,monkey4 --enable-release \
            --disable-libcurl --disable-sdlnet --disable-cloud --disable-updates --disable-tts
          make -j$(nproc)
          ccache -s

      # (Mesa's software OpenGL, llvmpipe: the runner has no GPU. Its opengl32.dll goes next to scummvm.exe, which Windows
      # searches before System32; the rest, libgallium_wgl.dll and LLVM, load from ucrt64\bin, which run.py puts on PATH)
      - name: Mesa llvmpipe
        shell: pwsh
        run: Copy-Item C:\msys64\ucrt64\bin\opengl32.dll scummvm\build\

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # (each game's renderers at once: tools/parallel.sh, a run.py --work of its own for each, under
      # $RUNNER_TEMP/parallel_grim/ and parallel_emi/: the checkout's path would make the game folders too long; grim.txt and emi.txt are their outputs one after the other)
      - name: Grim
        id: grim
        continue-on-error: true
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
          # (llvmpipe's threads: one per engine, the runs share the runner's few cores)
          LP_NUM_THREADS: "1"
          # (the windows on the runner's desktop; the runner is slower than a desk machine)
          CR_VISIBLE: "1"
          CR_STALL: "60"
          CR_STARTUP: "180"
        run: |
          export SCUMMVM="$GITHUB_WORKSPACE\\scummvm\\build\\scummvm.exe"
          rc=0
          CR_PARALLEL_DIR="$(cygpath -u "$RUNNER_TEMP")/parallel_grim" bash grim_tools/cleanroom/tools/parallel.sh --games grim --renderers "$CR_RENDERERS" || rc=$?
          cat "$(cygpath -u "$RUNNER_TEMP")"/parallel_grim/grim_*.txt > grim.txt
          exit $rc

      - name: EMI
        id: emi
        continue-on-error: true
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: "1"
          CR_VISIBLE: "1"
          CR_STALL: "60"
          CR_STARTUP: "180"
        run: |
          export SCUMMVM="$GITHUB_WORKSPACE\\scummvm\\build\\scummvm.exe"
          rc=0
          CR_PARALLEL_DIR="$(cygpath -u "$RUNNER_TEMP")/parallel_emi" bash grim_tools/cleanroom/tools/parallel.sh --games emi --renderers "$CR_RENDERERS" || rc=$?
          cat "$(cygpath -u "$RUNNER_TEMP")"/parallel_emi/emi_*.txt > emi.txt
          exit $rc

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          foreach ($g in "grim", "emi") {
            if (-not (Test-Path "$g.txt")) { continue }
            Add-Content $env:GITHUB_STEP_SUMMARY "### $g`n``````"
            Get-Content "$g.txt" | Where-Object { $_ -match '^==== |REGRESSION|tests differ|crashed or hung|not marked|fixed, take the mark out' } |
              ForEach-Object { if ($_.Length -gt 400) { $_.Substring(0, 400) + " ..." } else { $_ } } |
              Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY "``````"
          }

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanroom-logs
          path: |
            grim.txt
            emi.txt
            ${{ runner.temp }}/parallel_*/*/logs/
          if-no-files-found: ignore

      - name: Result
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.grim.outcome }}" -ne "success" -or "${{ steps.emi.outcome }}" -ne "success") {
            Write-Error "Grim: ${{ steps.grim.outcome }}, EMI: ${{ steps.emi.outcome }} (regressions or new crashers: see the summary and the logs)"
            exit 1
          }
